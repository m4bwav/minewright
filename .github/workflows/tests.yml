# Checks the skills' structure, manifests, links and public-safety guards, and tests both scripts on the three
# operating systems on the oldest and newest Python supported. mw_check.py is proven on a fixture add-on (pass) and
# a broken copy (fail); bds_run.py is tested against a fake server. The real-server test runs only where BDS is
# already cached, so CI never downloads it. The example job builds, tests and packs the example add-on.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        # ubuntu-latest is Ubuntu 26.04 since 2026-10-19 and setup-python has no 3.9 for it; keep 3.9 covered on 24.04.
        exclude:
          - { os: ubuntu-latest, python: "3.9" }
        include:
          - { os: ubuntu-24.04, python: "3.9" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skills, companions, manifests, links and text guards
        run: python tests/check_skills.py
      - name: script tests (the real-server test skips without a cached BDS)
        run: python tests/test_scripts.py
  example:
    # The example add-on: install, type check, lint, unit tests, bundle, .mcaddon, then the skill's own checks on it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/given-jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/given-jar/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - name: the .mcaddon exists
        run: ls -l dist/*.mcaddon
      - name: mw_check.py on the example (json, manifest, identifiers, components, typescript, lint, test)
        run: python ../../skills/minewright-checks/scripts/mw_check.py .
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
