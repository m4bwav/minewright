# Checks the skills' structure, manifests, links and public-safety guards, and tests both scripts on the three
# operating systems on the oldest and newest Python supported. mw_check.py is proven on a fixture add-on (pass) and
# a broken copy (fail); bds_run.py is tested against a fake server. The real-server test runs only where BDS is
# already cached, so CI never downloads it.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skills, companions, manifests, links and text guards
        run: python tests/check_skills.py
      - name: script tests (the real-server test skips without a cached BDS)
        run: python tests/test_scripts.py
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: build, test and check the example add-on (when it exists)
        shell: bash
        run: |
          if [ ! -d examples/given-jar ]; then echo "no examples/given-jar yet"; exit 0; fi
          cd examples/given-jar
          npm ci
          npm run build
          npm test
          python ../../skills/minewright-checks/scripts/mw_check.py .
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
